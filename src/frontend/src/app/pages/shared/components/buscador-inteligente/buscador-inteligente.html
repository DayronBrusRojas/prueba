<div class="search-container">

  <!-- SEARCH BOX -->
  <div class="search-box">

    <span class="material-icons search-icon">
      search
    </span>

    <input
      type="text"
      placeholder="Busca maquetas, categorías o materiales..."
      [(ngModel)]="searchTerm"
      (input)="buscar()">

    <button
      *ngIf="searchTerm"
      class="clear-btn"
      type="button"
      (click)="limpiarBusqueda()">

      <span class="material-icons clear-icon">
        close
      </span>

    </button>

  </div>

  <!-- CARGANDO -->
  <div class="loading-indicator" *ngIf="cargando">
    <span class="material-icons spinning">autorenew</span>
    Buscando...
  </div>

  <!-- RESULTADOS -->
  <div
    class="results-container"
    *ngIf="resultados.length > 0 && !cargando">

    <!-- HEADER -->
    <div class="results-header">

      Se encontraron

      <span>
        {{ resultados.length }}
      </span>

      resultados

    </div>

    <!-- CATEGORIAS -->
    <div class="section-title" *ngIf="categoriasFiltradas.length > 0">
      CATEGORÍAS
    </div>

    <!-- CATEGORIAS DINAMICAS DEL BACKEND -->
    <button
      class="search-item category-item"
      *ngFor="let cat of categoriasFiltradas"
      type="button"
      (click)="buscarPorCategoria(cat)">

      <div class="item-left">

        <div class="item-icon">
          <span class="material-icons">
            category
          </span>
        </div>

        <div class="item-content">

          <h4>
            {{ cat }}
          </h4>

          <p>
            Ver todas las maquetas de esta categoría
          </p>

        </div>

      </div>

      <span class="material-icons item-arrow">
        arrow_forward
      </span>

    </button>

    <!-- PRODUCTOS -->
    <div class="section-title">
      PRODUCTOS
    </div>

    <!-- PRODUCTOS DINAMICOS -->
    <button
      class="search-item product-item"
      *ngFor="let item of resultados"
      type="button"
      (click)="abrirDetalle(item)">

      <div class="item-left">

        <img
          [src]="item.imageUrl"
          [alt]="item.title"
          class="product-image">

        <div class="item-content">

          <h4>
            {{ item.title }}
          </h4>

          <p>
            {{ item.description || 'Modelo educativo detallado para aprendizaje interactivo.' }}
          </p>

          <span class="product-category">
            {{ item.category }}
          </span>

        </div>

      </div>

      <span class="material-icons item-arrow">
        arrow_forward
      </span>

    </button>

  </div>

  <!-- EMPTY -->
  <div
    class="empty-results"
    *ngIf="searchTerm && resultados.length === 0 && !cargando">

    <span class="material-icons">
      sentiment_dissatisfied
    </span>

    <h3>
      No encontramos resultados
    </h3>

    <p>
      Intenta con otra búsqueda o solicita
      una maqueta personalizada.
    </p>

    <button
      type="button"
      (click)="requestAccess.emit('personalizar')">

      Solicitar maqueta personalizada

    </button>

  </div>

</div>
