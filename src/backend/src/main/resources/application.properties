# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
# Define el nombre identificador del microservicio o aplicación en el contexto de Spring.
spring.application.name=backend

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (PostgreSQL)
# ===================================================================
# URL de conexión a la base de datos. 
# REQUERIDO: Configurar en Render en Settings > Environment
spring.datasource.url=${DB_URL}

# Credenciales de acceso a la base de datos.
# REQUERIDO: Configurar en Render en Settings > Environment
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# Controla la manipulación automática del esquema de la base de datos.
# 'none' es el valor estándar para producción, ya que evita que Hibernate altere o borre tablas existentes.
spring.jpa.hibernate.ddl-auto=none

# Habilita la impresión de las consultas SQL generadas por Hibernate en la consola.
spring.jpa.show-sql=true

# Da formato estético (con saltos de línea y sangrías) al SQL impreso en consola para facilitar la depuración.
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# ===================================================================
# Llave secreta utilizada para la firma digital de los tokens JWT. Debe tener al menos 256 bits.
# IMPORTANTE: En producción (Render), cambiar por una clave aleatoria fuerte en Settings > Environment
security.jwt.secret-key=${JWT_SECRET_KEY:amazonas_super_secret_key_2025_backend_jwt_secure_key_must_be_long_enough}

# Tiempo de expiración del token JWT en milisegundos (24 horas).
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}

# ===================================================================
# CONFIGURACIÓN DE FLYWAY (MIGRACIONES DE BASE DE DATOS)
# ===================================================================
# Habilita el control de versiones y migraciones automáticas con Flyway al levantar la aplicación.
spring.flyway.enabled=true

# Registra un baseline en el historial si la base de datos ya tiene tablas.
spring.flyway.baseline-on-migrate=true

# Versión asignada para el baseline inicial.
spring.flyway.baseline-version=0
# CONFIGURACIÓN DE CLOUDINARY
# ===================================================================
# REQUERIDO: Configurar en Render en Settings > Environment
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===================================================================
# CONFIGURACIÓN DE CORREO (spring-boot-starter-mail)
# ===================================================================
# IMPORTANTE: Usar contraseña de aplicación de Gmail (no la contraseña normal)
# Generar en: https://myaccount.google.com/apppasswords
# REQUERIDO: Configurar en Render en Settings > Environment
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# CONFIGURACIÓN DE URL DEL FRONTEND
# ===================================================================
# URL para enlace de recuperación de contraseña (debe apuntar a tu frontend)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
